<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Catálogo</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script src="catalogo.js"></script>
</head>

<body>

  <div
    id="app"
    class="catalog-app"
  >

    <div
      id="menu"
      style="display:none;"
    ></div>

    <main class="catalog-main">

      <header class="catalog-header">

        <div>

          <div
            class="catalog-store-name"
            id="catalogStoreName"
          >
            Catálogo
          </div>

          <div class="catalog-subtitle">
            Produtos disponíveis
          </div>

        </div>

        <button
          class="catalog-cart-button"
          onclick="openCart()"
        >
          🛒
          <span>Carrinho</span>

          <b id="cartCount">
            0
          </b>
        </button>

      </header>

      <div class="catalog-toolbar">

        <input
          type="text"
          id="catalogSearch"
          placeholder="Buscar produto..."
          oninput="renderCatalog()"
        >

      </div>

      <div
        id="catalogProducts"
        class="catalog-products"
      >

        <div class="catalog-loading">
          Carregando catálogo...
        </div>

      </div>

    </main>

  </div>

  <div
    id="productModal"
    class="catalog-modal hidden"
  >

    <div class="catalog-modal-card">

      <div class="catalog-modal-head">

        <h2 id="productModalTitle">
          Produto
        </h2>

        <button
          class="catalog-close"
          onclick="closeProductModal()"
        >
          ×
        </button>

      </div>

      <div id="productModalContent"></div>

    </div>

  </div>

  <div
    id="cartModal"
    class="catalog-modal hidden"
  >

    <div class="catalog-modal-card cart-card">

      <div class="catalog-modal-head">

        <h2>
          Meu carrinho
        </h2>

        <button
          class="catalog-close"
          onclick="closeCart()"
        >
          ×
        </button>

      </div>

      <div id="cartContent"></div>

    </div>

  </div>

  <div
    id="checkoutModal"
    class="catalog-modal hidden"
  >

    <div class="catalog-modal-card checkout-card">

      <div class="catalog-modal-head">

        <h2>
          Finalizar pedido
        </h2>

        <button
          class="catalog-close"
          onclick="closeCheckout()"
        >
          ×
        </button>

      </div>

      <div id="checkoutContent"></div>

    </div>

  </div>

  <style>
    .catalog-app {
      min-height: 100vh;
      background: #f7f8fb;
    }

    .catalog-main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 25px;
    }

    .catalog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .catalog-store-name {
      font-size: 25px;
      font-weight: 700;
      color: #242936;
    }

    .catalog-subtitle {
      color: #7b8391;
      font-size: 13px;
      margin-top: 4px;
    }

    .catalog-cart-button {
      border: 0;
      background: #5145cd;
      color: white;
      border-radius: 9px;
      padding: 11px 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .catalog-cart-button b {
      background: white;
      color: #5145cd;
      border-radius: 50%;
      min-width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .catalog-toolbar {
      margin-bottom: 20px;
    }

    .catalog-toolbar input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 15px;
      border: 1px solid #dce0e7;
      border-radius: 9px;
      background: white;
      outline: none;
      font-size: 13px;
    }

    .catalog-products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .catalog-product {
      background: white;
      border: 1px solid #e0e3e9;
      border-radius: 11px;
      overflow: hidden;
      transition: .15s;
    }

    .catalog-product:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 18px rgba(0, 0, 0, .06);
    }

    .catalog-product-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #f1f2f5;
    }

    .catalog-product-no-image {
      width: 100%;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f2f5;
      color: #9299a5;
      font-size: 13px;
    }

    .catalog-product-body {
      padding: 14px;
    }

    .catalog-product-name {
      font-size: 14px;
      font-weight: 600;
      color: #303643;
      margin-bottom: 7px;
    }

    .catalog-product-description {
      color: #7b8391;
      font-size: 11px;
      min-height: 31px;
      line-height: 1.45;
    }

    .catalog-product-price {
      margin-top: 11px;
      font-size: 17px;
      font-weight: 700;
      color: #343a46;
    }

    .catalog-product-action {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      border: 0;
      background: #5145cd;
      color: white;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
    }

    .catalog-loading,
    .catalog-empty {
      grid-column: 1 / -1;
      background: white;
      border: 1px solid #e0e3e9;
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      color: #7b8391;
    }

    .catalog-modal {
      position: fixed;
      inset: 0;
      background: rgba(20, 24, 31, .55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .catalog-modal.hidden {
      display: none;
    }

    .catalog-modal-card {
      background: white;
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .2);
    }

    .cart-card {
      max-width: 750px;
    }

    .checkout-card {
      max-width: 800px;
    }

    .catalog-modal-head {
      padding: 17px 20px;
      border-bottom: 1px solid #e7e9ee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: white;
      z-index: 2;
    }

    .catalog-modal-head h2 {
      margin: 0;
      font-size: 17px;
      color: #303643;
    }

    .catalog-close {
      border: 0;
      background: transparent;
      font-size: 25px;
      color: #737b88;
      cursor: pointer;
    }

    .product-detail {
      padding: 20px;
    }

    .product-detail-image {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      background: #f4f5f7;
      border-radius: 9px;
    }

    .product-detail-description {
      margin: 15px 0;
      color: #687180;
      font-size: 13px;
      line-height: 1.5;
    }

    .product-detail-price {
      font-size: 23px;
      font-weight: 700;
      color: #303643;
      margin: 15px 0;
    }

    .catalog-form-group {
      margin-bottom: 13px;
    }

    .catalog-form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #4a5260;
      margin-bottom: 5px;
    }

    .catalog-form-group input,
    .catalog-form-group select,
    .catalog-form-group textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 11px;
      border: 1px solid #d8dce4;
      border-radius: 7px;
      font-size: 12px;
      outline: none;
      background: white;
    }

    .catalog-form-group textarea {
      min-height: 85px;
      resize: vertical;
    }

    .catalog-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .catalog-form-full {
      grid-column: 1 / -1;
    }

    .catalog-quantity {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 15px 0;
    }

    .catalog-quantity button {
      width: 32px;
      height: 32px;
      border: 1px solid #d8dce4;
      background: white;
      border-radius: 6px;
      cursor: pointer;
    }

    .catalog-quantity strong {
      min-width: 30px;
      text-align: center;
    }

    .catalog-primary {
      width: 100%;
      border: 0;
      background: #5145cd;
      color: white;
      border-radius: 8px;
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 70px 1fr auto;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid #eceef2;
    }

    .cart-item-image {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 7px;
      background: #f2f3f5;
    }

    .cart-item-name {
      font-size: 13px;
      font-weight: 600;
      color: #343a46;
    }

    .cart-item-variation {
      font-size: 10px;
      color: #7b8391;
      margin-top: 3px;
    }

    .cart-item-observation {
      font-size: 10px;
      color: #7b8391;
      margin-top: 5px;
    }

    .cart-item-price {
      font-size: 13px;
      font-weight: 600;
      color: #343a46;
      white-space: nowrap;
    }

    .cart-item-remove {
      margin-top: 7px;
      border: 0;
      background: transparent;
      color: #c92335;
      font-size: 10px;
      cursor: pointer;
    }

    .cart-total {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 700;
    }

    .cart-actions {
      padding: 0 20px 20px;
    }

    .checkout-section {
      padding: 20px;
      border-bottom: 1px solid #eceef2;
    }

    .checkout-section h3 {
      margin: 0 0 13px;
      font-size: 14px;
      color: #343a46;
    }

    .checkout-required {
      color: #c92335;
    }

    .checkout-footer {
      padding: 18px 20px;
    }

    .checkout-total {
      display: flex;
      justify-content: space-between;
      margin-bottom: 13px;
      font-size: 17px;
      font-weight: 700;
    }

    @media (max-width: 900px) {

      .catalog-products {
        grid-template-columns: repeat(3, 1fr);
      }

    }

    @media (max-width: 650px) {

      .catalog-main {
        padding: 15px;
      }

      .catalog-products {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .catalog-product-image,
      .catalog-product-no-image {
        height: 170px;
      }

      .catalog-form-grid {
        grid-template-columns: 1fr;
      }

      .catalog-form-full {
        grid-column: auto;
      }

      .cart-item {
        grid-template-columns: 55px 1fr auto;
        padding: 12px;
      }

      .cart-item-image {
        width: 55px;
        height: 55px;
      }

    }
  </style>

</body>
</html>
